plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dicom'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
//	maven { url 'https://maven.dcm4che.org/' }   // ← 이거 추가
	maven { url = uri('https://maven.dcm4che.org/') }
	maven { url = uri('https://raw.githubusercontent.com/nroduit/mvn-repo/master/') }   // ← weasis용 추가
}

ext {
	set('springAiVersion', "2.0.0-RC2")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// 추가
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'

	implementation 'org.dcm4che:dcm4che-mime:5.34.1'   // ← 추가 (MultipartParser용)
	implementation 'org.dcm4che:dcm4che-deident:5.34.1'   // dcmr은 전이로 따라옴
	implementation "com.microsoft.onnxruntime:onnxruntime:1.20.0"

	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// DICOM
	implementation 'org.dcm4che:dcm4che-core:5.34.1'
	implementation 'org.dcm4che:dcm4che-imageio:5.34.1'

	//s3 연동
//	implementation 'software.amazon.awssdk:s3:2.28.16'
	implementation platform('software.amazon.awssdk:bom:2.31.0')
	implementation 'software.amazon.awssdk:s3'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// Bedrock (LLM 판독 소견서)
	implementation 'software.amazon.awssdk:bedrockruntime'

	implementation 'org.dcm4che:dcm4che-imageio:5.31.2'
	implementation 'org.dcm4che:dcm4che-imageio-opencv:5.31.2'
	runtimeOnly 'org.weasis.core:weasis-core-img:4.10.0'

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

bootJar {
	archiveBaseName = 'medical'      // 이름 부분
	archiveVersion = ''              // 버전 빼기
	// archiveClassifier = 'app'     // medical-app.jar 처럼 꼬리표
}

tasks.register('ebZip', Zip) {
	dependsOn bootJar
	archiveFileName = 'deploy.zip'
	destinationDirectory = layout.buildDirectory.dir('eb')

	// 빌드된 jar를 zip 루트에
	from(bootJar.archiveFile)
	// .platform 폴더를 zip 루트에 (nginx 설정 포함)
	from('.platform') {
		into '.platform'
	}
}