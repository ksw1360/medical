spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true #운영시엔 FALSE
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 5000
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: false
    diskspace:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

# swagger Basic Auth 계정 (SecurityConfig에서 사용)
# 비밀번호는 EB 환경 속성 SWAGGER_AUTH_PASSWORD에 설정
swagger:
  auth:
    username: ${SWAGGER_AUTH_USERNAME:dev}
    password: ${SWAGGER_AUTH_PASSWORD:localdev}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}

naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
  redirect-uri: ${NAVER_REDIRECT_URI}

nts:
  service-key: ${NTS_SERVICE_KEY}

aws:
  s3:
    enabled: true
    #    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION}
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  bedrock:
    enabled: true
    region: ${AWS_BEDROCK_REGION:ap-northeast-2}
    model-id: ${AWS_BEDROCK_MODEL_ID:apac.anthropic.claude-haiku-4-5-20251001-v1:0}   # ← } 닫음

# DICOM 저장 (S3)
dicom:
  storage:
    s3-bucket: medical-dicom-store
#    local-path: ./dicom-store   # 로컬 저장으로 되돌릴 때 사용

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

orthanc:
  base-url: http://localhost:8042 # 운영에선 제거
  username: orthanc
  password: orthanc

logging:
  level:
    org.apache.coyote.http11.Http11Processor: ERROR
